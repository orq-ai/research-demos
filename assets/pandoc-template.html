    MathJax CDN is the one external dependency we allow in this repo.
    Rendering math (TeX/LaTeX) offline requires a heavy binary or full Node.js
    toolchain (e.g. katex-cli). MathJax via CDN adds ~300KB on first load but
    keeps the build step to a single pandoc call with no extra npm/pip deps.
    See docs/conventions.md §2 for rationale.
  -->
